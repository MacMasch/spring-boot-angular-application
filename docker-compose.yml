version: "2"
services:
  backend:
    container_name: spring-boot-angular-application-backend
    build:
      context: backend
    image: spring-boot-angular-application-backend:latest
    ports:
      - "8080:8080"
    restart: always
  frontend:
    container_name: spring-boot-angular-application-frontend
    build:
      context: frontend
    image: spring-boot-angular-application-frontend:latest
    ports:
      - "4200:80"
    restart: always
    depends_on:
      - backend